    compileOnly "dev.latvian.mods:rhino:2101.2.7-build.85"
    compileOnly "curse.maven:advancedae-1084104:8236325"
    //compileOnly "curse.maven:functional-storage-556861:6467726"
    compileOnly "mezz.jei:jei-26.1.2-neoforge:29.5.0.26"
    //compileOnly "curse.maven:appliede-1009940:6500056"
    //compileOnly "curse.maven:projecte-226410:6611984"
    // runtime test
    //runtimeOnly "curse.maven:applied-flux-965012:5614830"
    //runtimeOnly ("de.mari_023:ae2wtlib:19.2.0") { transitive = false }
    runtimeOnly "curse.maven:jade-324717:8068368"
    //runtimeOnly "curse.maven:mega-cells-622112:6005043"
    //runtimeOnly "mekanism:Mekanism:1.21.1-10.7.17.83"
