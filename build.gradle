plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.134'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    mods {
        ae2netanalyser {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        gametestWorld {
            client()
            programArguments.addAll("--username", "Dev", "--quickPlaySingleplayer", "GametestWorld")
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        gametest {
            type = "gameTestServer"
            gameDirectory = project.file("build/gametest")
        }

    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        name = 'cursemaven'
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'KubeJS'
        url = "https://maven.latvian.dev/releases/"
    }
}

dependencies {
    implementation "io.github.glodblock:Glodium:26.1-1.2-neoforge"
    implementation "org.appliedenergistics:appliedenergistics2:26.1.8-alpha"
    implementation "org.appliedenergistics:guideme:26.1.10-alpha"
    //jarJar(implementation ("de.mari_023:ae2wtlib_api:19.2.0") { transitive = false })
    //compileOnly "curse.maven:applied-flux-965012:5614830"
    //compileOnly "dev.emi:emi-neoforge:1.1.10+1.21"
    //compileOnly "curse.maven:mega-cells-622112:6005043"
    compileOnly "curse.maven:jade-324717:8068368"
    //compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.729"
    //compileOnly "mekanism:Mekanism:1.21.1-10.7.17.83"
    //compileOnly "curse.maven:applied-mekanistics-574300:5978711"
